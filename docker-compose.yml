services:
  cw-read-msgs:
    build: .
    container_name: cw-read-msgs
    restart: unless-stopped
    ports:
      - "3200:3200"
    env_file: .env
    networks:
      - chatwoot_default

  broadcast-daemon:
    build:
      context: .
      dockerfile: stuff/broadcast-daemon/Dockerfile
    container_name: cw-read-msgs-broadcast-daemon
    restart: unless-stopped
    env_file: .env
    networks:
      - chatwoot_default

networks:
  chatwoot_default:
    external: true
